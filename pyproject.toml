[project]
name = "gaon-i-ai"
version = "0.1.0"
description = "Gaon-i AI server built with FastAPI, SQLAlchemy, Alembic, and pgvector."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.1.18",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
